<style>
  /* Тот же язык, что у «Покупок»: монохром iOS, вкладки снизу, шторки. Акцент = текст. */
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --text: #111113; --text2: #8e8e93; --text3: #c7c7cc;
    --line: rgba(0,0,0,0.07); --chip: #ededf0; --acc: #111113; --on-acc: #ffffff;
    --danger: #ff3b30; --good: #248a3d; --warn: #c93400; --mach: #b4b4bb; --move: #0a7aff;
    --bar: rgba(247,247,248,0.86);
    --shadow: 0 2px 8px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.06);
    --tabh: 56px; --safe-b: env(safe-area-inset-bottom, 0px);
    --gl: max(20px, env(safe-area-inset-left, 0px)); --gr: max(20px, env(safe-area-inset-right, 0px));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --surface: #141416; --text: #f5f5f7; --text2: #8e8e93; --text3: #3a3a3c;
      --line: rgba(255,255,255,0.08); --chip: #1d1d20; --acc: #f5f5f7; --on-acc: #000000;
      --good: #30d158; --warn: #ff9f0a; --mach: #5c5c63; --move: #3d9bff; --bar: rgba(10,10,12,0.86); --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #141416; --text: #f5f5f7; --text2: #8e8e93; --text3: #3a3a3c;
    --line: rgba(255,255,255,0.08); --chip: #1d1d20; --acc: #f5f5f7; --on-acc: #000000;
    --good: #30d158; --warn: #ff9f0a; --mach: #5c5c63; --move: #3d9bff; --bar: rgba(10,10,12,0.86); --shadow: none; color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    padding-block: env(safe-area-inset-top, 0px) calc(var(--tabh) + var(--safe-b) + 96px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
    font-variant-numeric: tabular-nums;
  }
  #app { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
  input, textarea { -webkit-user-select: text; user-select: text; font-family: inherit; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--text2); outline-offset: 2px; }

  header { padding: 26px var(--gr) 4px var(--gl); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  header h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.1; }
  #sub { font-size: 14px; color: var(--text2); margin-top: 4px; min-height: 18px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--chip); color: var(--text); display: flex; align-items: center; justify-content: center; flex: 0 0 38px; }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }

  .g-title { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; padding: 24px var(--gr) 6px var(--gl); }
  .g-title b { font-weight: 600; color: var(--text); text-transform: none; letter-spacing: 0; font-size: 14px; }
  .row { position: relative; display: flex; align-items: center; gap: 14px; padding: 13px var(--gr) 13px var(--gl); min-height: 56px; background: var(--bg); width: 100%; border: none; color: var(--text); text-align: left; font-size: inherit; }
  .row::after { content: ""; position: absolute; left: calc(var(--gl) + 36px); right: 0; bottom: 0; height: 1px; background: var(--line); }
  .row.flat::after { left: var(--gl); }
  .row:last-child::after { display: none; }
  .ck { width: 22px; height: 22px; flex: 0 0 22px; border: 1.5px solid var(--text3); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .ck.part { border-color: var(--text); border-style: dashed; }
  .done .ck { background: var(--acc); border-color: var(--acc); border-style: solid; }
  .done .ck::after { content: ""; width: 5px; height: 10px; border: solid var(--on-acc); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
  .r-main { flex: 1; min-width: 0; }
  .r-name { font-size: 17px; overflow-wrap: anywhere; }
  .r-sub { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .done .r-name { color: var(--text2); }
  .r-end { font-size: 15px; font-weight: 500; white-space: nowrap; text-align: right; }
  .r-end small { display: block; font-size: 12px; font-weight: 500; color: var(--text2); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .3px; padding: 2px 7px; border-radius: 9px; background: var(--chip); color: var(--text); margin-left: 6px; vertical-align: 1px; }
  .tag.up { background: var(--acc); color: var(--on-acc); }
  .tag.down { color: var(--warn); }
  .clear-btn { display: block; margin: 10px auto 0; border: none; background: none; color: var(--text2); font-size: 13px; padding: 10px 16px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 14px var(--gr) 2px var(--gl); }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 18px; padding: 8px 14px; font-size: 14px; font-weight: 500; }
  .chip:active { transform: scale(0.95); }
  .chip.sel { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }

  .note { margin: 14px var(--gr) 0 var(--gl); padding: 12px 14px; border-radius: 14px; background: var(--chip); font-size: 14px; line-height: 1.4; }
  .note b { font-weight: 600; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); margin: 16px 0 0; border-block: 1px solid var(--line); }
  .stat { background: var(--bg); padding: 14px var(--gr) 14px var(--gl); min-width: 0; }
  .stat:nth-child(2n) { padding-left: 16px; }
  .stat:nth-child(2n+1) { padding-right: 16px; }
  .st-l { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .6px; }
  .st-v { font-size: 26px; font-weight: 700; letter-spacing: -.5px; margin-top: 4px; }
  .st-v small { font-size: 15px; font-weight: 500; color: var(--text2); margin-left: 3px; letter-spacing: 0; }
  .st-d { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .st-d.good { color: var(--good); } .st-d.warn { color: var(--warn); }

  .chart { padding: 8px var(--gr) 0 var(--gl); }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .c-grid { stroke: var(--line); stroke-width: 1; }
  .c-lbl { fill: var(--text2); font-size: 10px; }
  .c-dot { fill: var(--text3); }
  .c-line { fill: none; stroke: var(--text); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .c-area { fill: var(--text); opacity: .06; }
  .c-end { fill: var(--text); }
  .spark { width: 64px; height: 26px; flex: 0 0 64px; }

  .empty { text-align: center; padding: 56px 40px 20px; color: var(--text2); }
  .empty svg { width: 44px; height: 44px; stroke: var(--text3); fill: none; stroke-width: 1.5; stroke-linecap: round; margin-bottom: 14px; }
  .empty h3 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 6px; text-wrap: balance; }
  .empty p { font-size: 15px; line-height: 1.45; }

  .pool { text-align: center; padding: 30px var(--gr) 0 var(--gl); }
  .pool .big { font-size: 84px; font-weight: 700; letter-spacing: -3px; line-height: 1; }
  .pool .unit { font-size: 15px; color: var(--text2); margin-top: 6px; }
  .pool .ctl { display: flex; justify-content: center; gap: 22px; margin-top: 26px; }
  .pool .ctl button { width: 76px; height: 76px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 34px; font-weight: 300; box-shadow: var(--shadow); }
  .pool .ctl button.plus { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
  .pool .ctl button:active { transform: scale(.94); }

  #dock { position: fixed; left: 0; right: 0; bottom: calc(var(--tabh) + var(--safe-b) + 14px); display: flex; gap: 10px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); justify-content: flex-end; pointer-events: none; z-index: 20; }
  #dock > * { pointer-events: auto; }
  .pill-btn { height: 52px; border: none; border-radius: 26px; background: var(--acc); color: var(--on-acc); font-size: 16px; font-weight: 600; box-shadow: var(--shadow); padding: 0 22px; }
  .pill-btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  .pill-btn.grow { flex: 1; }
  .pill-btn:active, #fab:active { transform: scale(0.96); }
  #fab { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 50%; border: none; background: var(--acc); color: var(--on-acc); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
  #fab svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }

  #tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabh) + var(--safe-b)); padding-bottom: var(--safe-b); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid var(--line); display: flex; z-index: 30; }
  .tb { flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text2); font-size: 11px; font-weight: 500; }
  .tb svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tb.sel { color: var(--text); }

  .bg { position: fixed; inset: 0; background: rgba(0,0,0,0.32); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60; }
  .bg.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); max-width: 560px; margin: 0 auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(18px + var(--safe-b)) max(20px, env(safe-area-inset-left, 0px)); transform: translateY(110%); transition: transform .3s cubic-bezier(.2,.8,.2,1); z-index: 70; max-height: 88vh; overflow-y: auto; }
  .sheet.show { transform: none; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--text3); margin: 0 auto 16px; }
  .s-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; text-wrap: balance; }
  .s-sub { font-size: 14px; color: var(--text2); margin-top: 4px; line-height: 1.4; }
  .s-label { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .6px; margin: 20px 0 8px; }
  .s-text { font-size: 15px; line-height: 1.5; }
  .s-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .advice { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--chip); font-size: 15px; line-height: 1.4; }
  .advice b { font-weight: 600; }
  .field { width: 100%; font-size: 17px; padding: 13px 14px; border: none; border-radius: 12px; background: var(--chip); color: var(--text); outline: none; min-width: 0; }
  .field::placeholder { color: var(--text2); }
  textarea.field { font-size: 13px; font-family: ui-monospace, Menlo, monospace; min-height: 160px; resize: vertical; }
  .set-row { display: grid; grid-template-columns: 22px 1fr 1fr 48px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .set-n { font-size: 15px; color: var(--text2); text-align: center; }
  .set-h { display: grid; grid-template-columns: 22px 1fr 1fr 48px; gap: 8px; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .set-ok { height: 48px; border-radius: 12px; border: 1.5px solid var(--text3); background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center; }

/* ---------- Хранилище ---------- */
const KEY = 'trener_v1';
function blank() { return { workouts: [], body: [], active: null, poolDraft: 0 }; }
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.workouts)) return Object.assign(blank(), d); } catch (e) {}
  return blank();
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- Утилиты ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function iso(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); }
const today = () => iso(new Date());
const days = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
const addDays = (d, n) => iso(new Date(new Date(d + 'T12:00').getTime() + n * 864e5));
const num = v => { if (v == null) return null; const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : null; };
const f1 = x => x == null ? '—' : String(Math.round(x * 10) / 10).replace('.', ',');
const f0 = x => x == null ? '—' : Math.round(x).toLocaleString('ru-RU');
const sign = x => (x > 0 ? '+' : x < 0 ? '−' : '±') + f1(Math.abs(x));
const dLong = d => new Date(d + 'T12:00').toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
const dShort = d => new Date(d + 'T12:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
const short = n => n.replace(/\s*\(.*\)$/, '');
const en = n => (n.match(/\((.*)\)$/) || [, ''])[1];
const e1rm = (w, r) => (w > 0 && r > 0 && r <= 15) ? w * (1 + r / 30) : null;

/* ---------- История и прогрессия ---------- */
function strength() { return S.workouts.filter(w => w.session !== 'P').sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id); }
function history(name) {
  return strength().map(w => ({ date: w.date, sets: w.sets.filter(s => s.ex === name) })).filter(x => x.sets.length);
}
function weekNo() {
  const first = strength()[0];
  const start = first ? first.date : (S.active ? today() : null);
  return start ? Math.floor(days(start, today()) / 7) + 1 : 1;
}
function plannedSets(ex) { return weekNo() === 1 ? 2 : ex.s; }
function roundW(ex, w) { return ex.db ? Math.round(w) : Math.round(w / 2.5) * 2.5; }

function advise(ex) {
  const h = history(ex.n);
  if (!h.length) return { w: null, tag: 'new', text: ex.sec ? 'Первый раз: просто держи, сколько получается с правильной техникой.' : 'Первый раз: подбери вес, чтобы в конце подхода оставалось ~3 повтора в запасе.' };
  const last = h[h.length - 1];
  const reps = last.sets.map(s => s.r).filter(x => x != null);
  const ws = last.sets.map(s => s.w).filter(x => x != null);
  const rirs = last.sets.map(s => s.rir).filter(x => x != null);
  const w = ws.length ? Math.max(...ws) : null;
  const unit = ex.sec ? 'с' : '';
  const was = `Прошлый раз (${dShort(last.date)}): ${w != null && !ex.sec ? f1(w) + ' кг × ' : ''}${reps.join(' / ')}${unit ? ' ' + unit : ''}`;
  if (!reps.length) return { w, tag: 'keep', text: was };
  const gap = days(last.date, today());
  if (gap > 7 && !ex.sec && w) {
    const nw = roundW(ex, w * 0.9);
    return { w: nw, tag: 'down', text: `${was}. Перерыв ${gap} дн. — начни с <b>${f1(nw)} кг</b>, дальше по самочувствию.` };
  }
  if (ex.sec) {
    return Math.min(...reps) >= ex.hi
      ? { w: null, tag: 'up', text: `${was}. Верх диапазона: <b>добавь 10 секунд</b>.` }
      : { w: null, tag: 'keep', text: `${was}. Цель: ${ex.hi} с во всех подходах.` };
  }
  const minRir = rirs.length ? Math.min(...rirs) : null;
  if (Math.min(...reps) >= ex.hi && (minRir == null || minRir >= 1)) {
    const step = ex.db ? 2 : ex.low ? 5 : 2.5;
    const nw = w != null ? roundW(ex, w + step) : null;
    return { w: nw, tag: 'up', text: `${was}. Все подходы на верху диапазона: <b>поднимай вес${nw != null ? ' до ' + f1(nw) + ' кг' : ''}</b>${ex.db ? ' (следующая пара гантелей)' : ' (или ближайшая плитка в тренажёре)'}. Повторы упадут к ${ex.lo} — это нормально.` };
  }
  if (Math.min(...reps) >= ex.hi) return { w, tag: 'keep', text: `${was}. Верх диапазона, но на отказ. Оставь <b>${f1(w)} кг</b> и сделай так же, с запасом 1–2 повтора.` };
  const prev = h.length > 1 ? h[h.length - 2].sets.map(s => s.r).filter(x => x != null) : [];
  if (Math.min(...reps) < ex.lo && prev.length && Math.min(...prev) < ex.lo && w) {
    const nw = roundW(ex, w * 0.92);
    return { w: nw, tag: 'down', text: `${was}. Второй раз ниже ${ex.lo} повторов: <b>снизь до ${f1(nw)} кг</b>. Проверим сон и технику.` };
  }
  if (Math.min(...reps) < ex.lo) return { w, tag: 'keep', text: `${was}. Ниже диапазона — ещё одна попытка с <b>${f1(w)} кг</b>.` };
  return { w, tag: 'keep', text: `${was}. Оставь <b>${f1(w)} кг</b> и добавь +1 повтор в слабых подходах. Цель: ${ex.hi} во всех.` };
}

/* ---------- Состояние экрана ---------- */
let tab = 'today';
function suggest() {
  if (S.active) return S.active.session;
  const t = S.workouts.filter(w => w.date === today()).pop();
  if (t) return t.session;
  if (new Date().getDay() === 3) return 'P';
  const last = strength().pop();
  return last ? (last.session === 'A' ? 'B' : 'A') : 'A';
}
let sel = suggest();

/* ---------- Отдых ---------- */
let restEnd = 0, restTimer = null;
function startRest(sec) {
  restEnd = Date.now() + sec * 1000;
  clearInterval(restTimer);
  restTimer = setInterval(tickRest, 500);
  tickRest();
}
function tickRest() {
  const left = Math.ceil((restEnd - Date.now()) / 1000);
  const el = $('#restPill');
  if (left <= 0) { clearInterval(restTimer); restEnd = 0; if (el) renderDock(); toast('Отдых окончен — следующий подход'); try { navigator.vibrate && navigator.vibrate(300); } catch (e) {} return; }
  if (el) el.textContent = `Отдых ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  else renderDock();
}

/* ---------- Рендер ---------- */
function render() {
  document.querySelectorAll('.tb').forEach(b => b.classList.toggle('sel', b.dataset.tab === tab));
  if (tab === 'today') renderToday();
  if (tab === 'body') renderBody();
  if (tab === 'prog') renderProg();
  renderDock();
}

function renderToday() {
  $('#title').textContent = 'Тренировка';
  const wk = weekNo();
  $('#sub').textContent = `${dLong(today())} · неделя ${wk}`;
  let h = `<div class="chips">${['A', 'B', 'P'].map(k => `<button class="chip${k === sel ? ' sel' : ''}" data-sel="${k}">${SNAME[k]}</button>`).join('')}</div>`;
  const doneToday = S.workouts.filter(w => w.date === today() && w.session === sel);
  if (doneToday.length && !S.active) {
    const w = doneToday[doneToday.length - 1];
    h += `<div class="note"><b>Сегодня уже записано:</b> ${w.session === 'P' ? (w.laps + ' × 25 м = ' + w.laps * 25 + ' м') : (w.sets.length + ' подходов' + (w.dur ? ', ' + Math.round(w.dur / 60) + ' мин' : ''))}. Отдыхай и восстанавливайся.</div>`;
  }
  if (sel === 'P') { $('#view').innerHTML = h + poolHtml(); return; }
  if (S.active && S.active.session !== sel) {
    h += `<div class="note">Идёт <b>${SNAME[S.active.session]}</b>. Сначала заверши или отмени её.</div>`;
  }
  if (wk === 1) h += `<div class="note"><b>Неделя 1:</b> по 2 подхода, вес такой, чтобы оставалось ~3 повтора в запасе. Подбираем веса, не убиваемся.</div>`;
  const list = PLAN[sel];
  const act = S.active && S.active.session === sel ? S.active.sets : [];
  const doneN = list.filter(ex => act.filter(s => s.ex === ex.n).length >= plannedSets(ex)).length;
  h += `<div class="g-title"><span>Упражнения</span><b>${doneN} из ${list.length}</b></div><div>`;
  list.forEach((ex, i) => {
    const a = advise(ex);
    const got = act.filter(s => s.ex === ex.n).length;
    const ps = plannedSets(ex);
    const cls = got >= ps ? 'done' : '';
    const tag = a.tag === 'up' ? '<span class="tag up">↑</span>' : a.tag === 'down' ? '<span class="tag down">↓</span>' : '';
    const right = ex.sec ? `${ex.lo}–${ex.hi}<small>сек</small>` : a.w != null ? `${f1(a.w)}<small>кг${ex.db ? ' × 2' : ''}</small>` : `<small>подобрать</small>`;
    h += `<button class="row ${cls}" data-ex="${sel}:${i}"><span class="ck${got && got < ps ? ' part' : ''}"></span>${IMGS[ex.n] ? `<img class="r-img" src="${IMGS[ex.n][IMGS[ex.n].length - 1]}" alt="" loading="lazy" onerror="thumbFail(this)"><svg class="r-thumb" hidden viewBox="10 4 180 124" aria-hidden="true">${FIG[ex.n] || ''}</svg>` : `<svg class="r-thumb" viewBox="10 4 180 124" aria-hidden="true">${FIG[ex.n] || ''}</svg>`}<span class="r-main"><div class="r-name">${esc(short(ex.n))}${tag}</div><div class="r-sub">${got ? got + ' из ' : ''}${ps} × ${ex.lo}–${ex.hi}${ex.sec ? ' с' : ''} · отдых ${ex.rest >= 120 ? ex.rest / 60 + ' мин' : ex.rest + ' с'}</div></span><span class="r-end">${right}</span></button>`;
  });
  h += `</div>`;
  if (S.active && S.active.session === sel) h += `<button class="clear-btn" id="cancelW">Отменить тренировку</button>`;
  else h += `<div class="note" style="margin-top:22px">Разминка: 5–8 мин дорожка или велосипед, затем 1–2 лёгких подхода в первом упражнении.</div>`;
  $('#view').innerHTML = h;
}

function poolHtml() {
  const last = S.workouts.filter(w => w.session === 'P').pop();
  const n = S.poolDraft || 0;
  return `<div class="pool"><div class="big">${n}</div><div class="unit">отрезков по 25 м · ${n * 25} м</div>
    <div class="ctl"><button id="poolMinus" aria-label="Минус отрезок">−</button><button class="plus" id="poolPlus" aria-label="Плюс отрезок">+</button></div></div>
    <div class="note" style="margin-top:28px"><b>Цель:</b> 10–12 отрезков спокойно. Проплыл 25 м — отдых у бортика 30–60 с, нажал «+».${last ? `<br>Прошлый раз (${dShort(last.date)}): ${last.laps} × 25 м = ${last.laps * 25} м.` : ''}</div>`;
}

function renderDock() {
  let h = '';
  if (restEnd) h += `<button class="pill-btn ghost" id="restPill">Отдых</button>`;
  if (tab === 'today' && sel !== 'P' && S.active && S.active.session === sel && S.active.sets.length) h += `<button class="pill-btn grow" id="finishBtn">Завершить тренировку</button>`;
  if (tab === 'today' && sel === 'P' && S.poolDraft > 0) h += `<button class="pill-btn grow" id="poolSave">Сохранить заплыв</button>`;

  else {
    const by = {}; w.sets.forEach(s => (by[s.ex] = by[s.ex] || []).push(s));
    Object.entries(by).forEach(([n, ss]) => { const ex = ALL.find(e => e.n === n) || {}; h += `<div class="ir"><span>${esc(short(n))}</span><span>${ss.map(s => (s.w != null && !ex.sec ? f1(s.w) + '×' : '') + s.r).join('  ')}${ss[0].rir != null ? ' · запас ' + ss[0].rir : ''}</span></div>`; });
  }
  h += `</div><div class="actions"><button class="btn danger" id="wDel">Удалить</button><button class="btn primary" id="wCopy">Скопировать</button></div>`;
  openSheet(h);
  $('#wCopy').onclick = () => copy(workoutText(w));
  $('#wDel').onclick = async () => { if (await ask('Удалить тренировку?', 'Вернуть не получится.', 'Удалить', true)) { S.workouts = S.workouts.filter(x => x.id !== id); save(); closeSheet(); sel = suggest(); render(); } };
}

/* ---------- Отчёты ---------- */
const csvLine = a => a.map(v => v == null ? '' : /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v).join(',');
function workoutCsv(list) { return list.filter(w => w.session !== 'P').flatMap(w => w.sets.map(s => csvLine([w.date, w.session, s.ex, s.set, s.w, s.r, s.rir, '']))); }
function workoutText(w) {
  if (w.session === 'P') return `Бассейн ${w.date}: ${w.laps} × 25 м = ${w.laps * 25} м`;
  return `Тренировка ${w.session}, ${w.date}${w.dur ? ', ' + Math.round(w.dur / 60) + ' мин' : ''}\n\nworkout_log.csv\ndate,session,exercise,set,weight_kg,reps,rir,notes\n${workoutCsv([w]).join('\n')}`;
}
function report(nDays) {
  const from = nDays ? addDays(today(), -nDays + 1) : '0000';
  const W = S.workouts.filter(w => w.date >= from).sort((a, b) => a.date < b.date ? -1 : 1);
  const B = bodySorted().filter(b => b.date >= from);
  const P = W.filter(w => w.session === 'P');
  return `ОТЧЁТ ДЛЯ ТРЕНЕРА ${nDays ? '(' + nDays + ' дн., до ' + today() + ')' : '(вся история)'}\n\nworkout_log.csv\ndate,session,exercise,set,weight_kg,reps,rir,notes\n${workoutCsv(W).join('\n')}\n\nbody_metrics.csv\ndate,weight_kg,waist_cm,sleep_h,steps,notes\n${B.map(b => csvLine([b.date, b.weight, b.waist, b.sleep, b.steps, ''])).join('\n')}\n\nБассейн:\n${P.map(p => `${p.date}: ${p.laps} × 25 м`).join('\n') || '—'}`;
}
function copy(text) {
  const done = () => toast('Скопировано — вставь в чат тренеру');
  const fallback = () => {
    openSheet(`<div class="s-title">Скопируй текст</div><div class="s-sub">Выдели всё и скопируй.</div><textarea class="field" id="cp" style="margin-top:14px" readonly>${esc(text)}</textarea><div class="actions"><button class="btn primary" data-close>Готово</button></div>`);
    const t = $('#cp'); t.focus(); t.select();
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}
function settingsSheet() {
  openSheet(`<div class="s-title">Тренер</div><div class="s-sub">Данные хранятся только на этом телефоне.</div><div style="margin-top:8px">
    <button class="menu-btn" id="m14"><span>Отчёт за 2 недели<small>Для еженедельного разбора в чате</small></span>›</button>
    <button class="menu-btn" id="mAll"><span>Вся история<small>Тренировки и замеры в CSV</small></span>›</button>
    <button class="menu-btn" id="mBak"><span>Резервная копия<small>Скопировать все данные</small></span>›</button>
    <button class="menu-btn" id="mRes"><span>Восстановить из копии<small>Вставить ранее скопированные данные</small></span>›</button>
    <button class="menu-btn red" id="mDel"><span>Удалить все данные</span></button></div>`);
  $('#m14').onclick = () => copy(report(14));
  $('#mAll').onclick = () => copy(report(0));
  $('#mBak').onclick = () => copy(JSON.stringify(S));
  $('#mRes').onclick = () => {
    openSheet(`<div class="s-title">Восстановить</div><div class="s-sub">Вставь резервную копию. Текущие данные заменятся.</div><textarea class="field" id="imp" style="margin-top:14px" placeholder='{"workouts":[...'></textarea><div class="actions"><button class="btn ghost" data-close>Отмена</button><button class="btn primary" id="impGo">Восстановить</button></div>`);
    $('#impGo').onclick = async () => {
      let d; try { d = JSON.parse($('#imp').value); } catch (e) { toast('Это не похоже на резервную копию'); return; }
      if (!d || !Array.isArray(d.workouts) || !Array.isArray(d.body)) { toast('В копии нет тренировок и замеров'); return; }
      if (!(await ask('Заменить данные?', `${d.workouts.length} тренировок, ${d.body.length} замеров.`, 'Заменить', true))) return;
      S = Object.assign(blank(), d); save(); closeSheet(); sel = suggest(); render(); toast('Восстановлено');
    };
  };
  $('#mDel').onclick = async () => { if (await ask('Удалить все данные?', 'Все тренировки и замеры исчезнут. Сначала сделай резервную копию.', 'Удалить', true)) { S = blank(); save(); closeSheet(); sel = suggest(); render(); } };
}

/* ---------- Шторка, диалог, тост ---------- */
function openSheet(h) { $('#sheetBody').innerHTML = h; $('#sheet').scrollTop = 0; $('#sheet').classList.add('show'); $('#bg').classList.add('show'); }
function closeSheet() { $('#sheet').classList.remove('show'); $('#bg').classList.remove('show'); openEx = null; document.activeElement && document.activeElement.blur && document.activeElement.blur(); }
function ask(title, sub, yes, danger) {
  return new Promise(res => {
    $('#dlgTitle').textContent = title; $('#dlgSub').textContent = sub || '';
    const y = $('#dlgYes'); y.textContent = yes || 'Да'; y.className = 'btn ' + (danger ? 'red' : 'primary');
    $('#dlg').classList.add('show');
    const end = v => { $('#dlg').classList.remove('show'); y.onclick = $('#dlgNo').onclick = null; res(v); };
    y.onclick = () => end(true); $('#dlgNo').onclick = () => end(false);
  });
}
let tt; function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200); }

/* ---------- События ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, .bg'); if (!t) return;
  if (t.id === 'bg' || t.hasAttribute('data-close')) return closeSheet();
  if (t.dataset.tab) { tab = t.dataset.tab; window.scrollTo(0, 0); return render(); }
  if (t.dataset.sel) { sel = t.dataset.sel; return render(); }
  if (t.dataset.ex) return exSheet(t.dataset.ex);
  if (t.dataset.log != null) return logSet(+t.dataset.log);
  if (t.dataset.rir != null) return setRir(+t.dataset.rir);
  if (t.dataset.body) return bodySheet(t.dataset.body);
  if (t.dataset.hist) return histSheet(t.dataset.hist);
  if (t.dataset.w) return wSheet(+t.dataset.w);
  switch (t.id) {
    case 'gear': return settingsSheet();
    case 'fab': return bodySheet(null);
    case 'finishBtn': return finish();
    case 'restPill': restEnd = 0; clearInterval(restTimer); return renderDock();
    case 'poolPlus': S.poolDraft = (S.poolDraft || 0) + 1; save(); return render();
    case 'poolMinus': S.poolDraft = Math.max(0, (S.poolDraft || 0) - 1); save(); return render();
    case 'poolSave': {
      if (!(await ask('Сохранить заплыв?', `${S.poolDraft} × 25 м = ${S.poolDraft * 25} м`, 'Сохранить'))) return;
      S.workouts.push({ id: Date.now(), date: today(), session: 'P', laps: S.poolDraft, sets: [] }); S.poolDraft = 0; save(); toast('Заплыв записан'); return render();
    }
    case 'cancelW': {
      if (!(await ask('Отменить тренировку?', 'Записанные подходы удалятся.', 'Отменить', true))) return;
      S.active = null; restEnd = 0; clearInterval(restTimer); save(); return render();
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && /^[wr]\d+$/.test(e.target.id || '')) { e.preventDefault(); logSet(+e.target.id.slice(1)); }
});
if (window.visualViewport) {
  const kb = () => { const v = window.visualViewport; document.documentElement.style.setProperty('--kb', Math.max(0, innerHeight - v.height - v.offsetTop) + 'px'); };
  visualViewport.addEventListener('resize', kb); visualViewport.addEventListener('scroll', kb);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (!S.active) sel = suggest(); render(); } });
render();
</script>
</body>
</html>
